send_command:
  name: Send Command
  description: "Send a protocol-specific raw BLE command for debugging. Use only with the active controller family protocol reference."
  fields:
    device_id:
      name: Device ID
      description: "MAC address or last 4-5 characters of heater MAC. Specify a target when more than one heater is configured."
      required: false
      example: "B864"
      selector:
        text:
    command:
      name: Command
      description: "Command number (0-255). Meanings vary by protocol; see the protocol reference before using this diagnostic action."
      required: true
      example: 20
      selector:
        number:
          min: 0
          max: 255
          mode: box
    argument:
      name: Argument
      description: "Argument value (-128 to 127). Negative values are encoded as two's complement."
      required: true
      example: 0
      selector:
        number:
          min: -128
          max: 127
          mode: box

recover_bluetooth:
  name: Recover Bluetooth adapter
  description: >
    Reset the Bluetooth adapter at kernel level (HCIDEVDOWN/HCIDEVUP + rfkill
    unblock + USB reset) to work around a BlueZ scanner stall. Use this when
    the heater is unreachable but the adapter still appears loaded in Home
    Assistant — much lighter than restarting HA or the Raspberry Pi.
  fields:
    adapter:
      name: Adapter
      description: >
        Specific HCI adapter to recover (e.g. hci0). If omitted, every HCI
        adapter known to Home Assistant is recovered.
      required: false
      example: hci0
      selector:
        text:
