[project]
name = "homeassistant-vevor-heater"
version = "1.0.27"
description = "Home Assistant integration for Vevor/Hcalory/Sunster diesel heaters via BLE"
requires-python = ">=3.12"
license = {text = "MIT"}

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.0",
    "ruff>=0.4.0",
    "voluptuous>=0.13.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

# Tests import conftest first to install the Home Assistant stub finder,
# and use function-level imports to load stubs before the real modules,
# so import order in tests/ is intentional and cannot be sorted.
[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402", "I001"]

[tool.coverage.run]
source = ["custom_components/vevor_heater", "diesel_heater_ble"]

[tool.coverage.report]
show_missing = true
fail_under = 20
